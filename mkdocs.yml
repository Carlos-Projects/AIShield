site_name: AIShield
site_description: Security scanner for the LLM fine-tuning lifecycle
site_url: https://carlos-projects.github.io/AIShield
repo_url: https://github.com/Carlos-Projects/AIShield
repo_name: Carlos-Projects/AIShield
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - content.code.copy
    - content.tabs.link

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI Reference: cli.md
  - Architecture: architecture.md
  - Examples: examples.md
  - Integrations: integrations.md
  - Development: development.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Carlos-Projects/AIShield

copyright: Copyright &copy; 2026 Carlos Rocha. MIT License.
